<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EcoTabuleiro - Rumo ao Futuro Verde</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap');
    body {
      font-family: 'Fredoka', sans-serif;
      background-color: #f0fdf4;
    }
    .board-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
    }
    .pawn {
      transition: all 0.4s ease-in-out;
    }
    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.05); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
    .active-player-card {
      animation: pulse-ring 2s infinite ease-in-out;
    }
  </style>
</head>
<body class="min-h-screen text-slate-800 flex flex-col justify-between">

  <!-- Header / Navbar -->
  <header class="bg-emerald-700 text-white shadow-lg p-4">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <h1 class="text-2xl md:text-3xl font-bold flex items-center gap-2">
        <i class="fa-solid fa-leaf text-lime-400"></i> EcoTabuleiro
      </h1>
      <button onclick="resetGame()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold px-4 py-2 rounded-lg border border-emerald-400 transition text-sm md:text-base flex items-center gap-2">
        <i class="fa-solid fa-rotate-right"></i> Novo Jogo
      </button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-6xl mx-auto p-4 flex-grow w-full grid grid-cols-1 lg:grid-cols-3 gap-6 my-4">

    <!-- Left / Top Controls & Status Panel -->
    <div class="lg:col-span-1 flex flex-col gap-4">
      
      <!-- Player Setup Card (visible before start) -->
      <div id="setup-panel" class="bg-white p-5 rounded-2xl shadow-md border border-emerald-100">
        <h2 class="text-xl font-bold text-emerald-800 mb-3 flex items-center gap-2">
          <i class="fa-solid fa-sliders"></i> Configuração da Partida
        </h2>
        
        <div class="mb-4">
          <label class="block text-sm font-semibold mb-2">Modo de Jogo:</label>
          <div class="grid grid-cols-2 gap-2">
            <button id="btn-vs-ai" onclick="setMode('ai')" class="py-2 px-3 border-2 border-emerald-600 bg-emerald-50 text-emerald-800 font-bold rounded-xl text-sm transition">
              <i class="fa-solid fa-robot"></i> Solo (Vs Bot)
            </button>
            <button id="btn-vs-p2" onclick="setMode('pvp')" class="py-2 px-3 border-2 border-slate-200 text-slate-600 font-bold rounded-xl text-sm transition">
              <i class="fa-solid fa-users"></i> Multijogador
            </button>
          </div>
        </div>

        <div id="player-count-group" class="mb-4 hidden">
          <label class="block text-sm font-semibold mb-2">Quantidade de Jogadores:</label>
          <select id="select-players" onchange="initGame()" class="w-full p-2 border border-slate-300 rounded-xl font-medium focus:ring-2 focus:ring-emerald-500 focus:outline-none">
            <option value="2">2 Jogadores</option>
            <option value="3">3 Jogadores</option>
            <option value="4">4 Jogadores</option>
          </select>
        </div>

        <button onclick="startGame()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl shadow-lg shadow-emerald-600/30 transition flex justify-center items-center gap-2">
          <i class="fa-solid fa-play"></i> Iniciar Jogo
        </button>
      </div>

      <!-- Player Turn & Scoreboard -->
      <div id="scoreboard-panel" class="bg-white p-5 rounded-2xl shadow-md border border-emerald-100 flex-grow flex flex-col justify-between">
        <div>
          <h2 class="text-xl font-bold text-emerald-800 mb-4 flex items-center gap-2">
            <i class="fa-solid fa-trophy"></i> Placar dos Ecologistas
          </h2>
          <div id="players-list" class="space-y-3">
            <!-- Player cards generated via JS -->
          </div>
        </div>

        <!-- Action Area (Dice Roll) -->
        <div class="mt-6 pt-4 border-t border-slate-100 text-center">
          <div id="turn-indicator" class="text-sm font-bold text-slate-500 mb-2">Aguardando início...</div>
          
          <div class="flex items-center justify-center gap-4 my-2">
            <div id="dice-visual" class="w-16 h-16 bg-emerald-600 text-white font-bold text-3xl rounded-2xl flex items-center justify-center shadow-md transform transition hover:scale-105">
              <i class="fa-solid fa-dice-d6"></i>
            </div>
            <button id="btn-roll" onclick="rollDice()" disabled class="bg-amber-500 hover:bg-amber-400 disabled:opacity-50 text-white font-extrabold text-lg px-6 py-3 rounded-xl shadow-md transition transform active:scale-95 flex items-center gap-2">
              <i class="fa-solid fa-dice"></i> Rolar Dado
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Right / Main Board View -->
    <div class="lg:col-span-2 bg-white p-4 md:p-6 rounded-2xl shadow-md border border-emerald-100 flex flex-col items-center justify-center">
      <div id="board" class="board-grid w-full max-w-2xl aspect-square md:aspect-auto">
        <!-- Board cells dynamically created here -->
      </div>
    </div>
  </main>

  <!-- Modal for Cards / Quizzes / Alerts -->
  <div id="modal-overlay" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50 hidden">
    <div class="bg-white rounded-3xl shadow-2xl max-w-md w-full p-6 text-center transform transition-all border-4 border-emerald-500">
      <div id="modal-icon" class="w-16 h-16 rounded-full mx-auto mb-3 flex items-center justify-center text-3xl bg-emerald-100 text-emerald-600">
        <i class="fa-solid fa-circle-info"></i>
      </div>
      <h3 id="modal-title" class="text-2xl font-bold text-slate-800 mb-2">Título do Evento</h3>
      <p id="modal-desc" class="text-slate-600 mb-6 text-sm md:text-base">Descrição detalhada do evento ecológico ou pergunta.</p>

      <!-- Quiz Choices Container -->
      <div id="quiz-options" class="space-y-2 mb-4 hidden">
        <!-- Buttons injected dynamically -->
      </div>

      <!-- Action Button (Non-quiz) -->
      <button id="modal-close-btn" onclick="closeModal()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl transition shadow-md">
        Continuar
      </button>
    </div>
  </div>

  <!-- Footer -->
  <footer class="bg-slate-800 text-slate-300 text-center py-3 text-xs md:text-sm mt-auto">
    <p>EcoTabuleiro &copy; 2026 - Conscientização e Sustentabilidade em Jogo.</p>
  </footer>

  <script>
    // Game Data & Configs
    const TOTAL_HOUSES = 30;
    
    // Players Configuration
    const PLAYER_CONFIGS = [
      { id: 0, name: "Jogador 1", color: "bg-emerald-500", textCol: "text-emerald-500", borderCol: "border-emerald-500", icon: "fa-leaf" },
      { id: 1, name: "EcoBot", color: "bg-blue-500", textCol: "text-blue-500", borderCol: "border-blue-500", icon: "fa-robot" },
      { id: 2, name: "Jogador 3", color: "bg-amber-500", textCol: "text-amber-500", borderCol: "border-amber-500", icon: "fa-sun" },
      { id: 3, name: "Jogador 4", color: "bg-purple-500", textCol: "text-purple-500", borderCol: "border-purple-500", icon: "fa-droplet" },
    ];

    // Quiz Questions Pool
    const QUIZ_QUESTIONS = [
      {
        q: "Qual destas opções é a forma correta de economizar água?",
        options: [
          { text: "Fechar a torneira ao escovar os dentes", correct: true },
          { text: "Lavar a calçada com mangueira todos os dias", correct: false },
          { text: "Demorar 30 minutos no banho quente", correct: false }
        ],
        explanation: "Fechar a torneira economiza até 12 litros de água a cada escovação!"
      },
      {
        q: "Qual lixeira é destinada ao descarte de PAPEL na Coleta Seletiva?",
        options: [
          { text: "Vermelha", correct: false },
          { text: "Azul", correct: true },
          { text: "Amarela", correct: false }
        ],
        explanation: "Azul é para Papel, Vermelha para Plástico e Amarela para Metal."
      },
      {
        q: "O que significa o conceito dos '3 Rs' da Sustentabilidade?",
        options: [
          { text: "Reciclar, Reutilizar, Reduzir", correct: true },
          { text: "Reaproveitar, Rasgar, Repor", correct: false },
          { text: "Recolher, Resfriar, Reter", correct: false }
        ],
        explanation: "Reduzir o consumo, Reutilizar objetos e Reciclar materiais!"
      },
      {
        q: "Onde devemos descartar pilhas e baterias usadas?",
        options: [
          { text: "No lixo comum de casa", correct: false },
          { text: "No jardim para afastar pragas", correct: false },
          { text: "Em pontos de coleta específicos / Logística Reversa", correct: true }
        ],
        explanation: "Pilhas contêm metais pesados tóxicos e exigem descarte adequado."
      },
      {
        q: "Qual destas é considerada uma fonte de Energia Renovável e Limpa?",
        options: [
          { text: "Queima de Carvão Mineral", correct: false },
          { text: "Energia Solar (Painéis fotovoltaicos)", correct: true },
          { text: "Combustão de Petróleo", correct: false }
        ],
        explanation: "A energia solar vem do Sol e não emite gases poluentes na geração."
      }
    ];

    // Board Tiles Customization Map
    const BOARD_TILES_DATA = {
      1: { type: "start", name: "Início", icon: "fa-play", desc: "Começo da jornada ecológica!" },
      3: { type: "good", name: "Plantou Árvore", icon: "fa-tree", points: 20, move: 2, desc: "Você plantou uma muda nativa! Avance 2 casas e ganhe 20 EcoPontos." },
      6: { type: "bad", name: "Lixo no Chão", icon: "fa-trash-can", points: -10, move: -2, desc: "Jogou lixo fora da lixeira. Volte 2 casas e perca 10 EcoPontos." },
      9: { type: "quiz", name: "Desafio EcoQuiz", icon: "fa-circle-question", desc: "Responda corretamente para avançar!" },
      12: { type: "good", name: "Painel Solar", icon: "fa-solar-panel", points: 30, move: 3, desc: "Instalou energia solar em casa! Avance 3 casas e ganhe 30 EcoPontos." },
      15: { type: "bad", name: "Vazamento de Água", icon: "fa-faucet-drip", points: -20, move: -3, desc: "Torneira pingando dia todo. Volte 3 casas e perca 20 EcoPontos." },
      18: { type: "quiz", name: "Desafio EcoQuiz", icon: "fa-circle-question", desc: "Responda corretamente para avançar!" },
      21: { type: "good", name: "Horta Comunitária", icon: "fa-seedling", points: 25, move: 2, desc: "Ajudou na horta do bairro! Avance 2 casas e ganhe 25 EcoPontos." },
      24: { type: "bad", name: "Queimada Ilegal", icon: "fa-fire", points: -30, move: -4, desc: "Fumaça e poluição! Volte 4 casas e perca 30 EcoPontos." },
      27: { type: "quiz", name: "Desafio EcoQuiz", icon: "fa-circle-question", desc: "Responda corretamente para avançar!" },
      30: { type: "finish", name: "Chegada Verde", icon: "fa-flag-checkered", desc: "Parabéns! Você contribuiu para um planeta sustentável!" }
    };

    // State Variables
    let gameMode = 'ai'; // 'ai' or 'pvp'
    let numPlayers = 2;
    let players = [];
    let currentPlayerIdx = 0;
    let isRolling = false;
    let gameActive = false;

    // Elements
    const boardEl = document.getElementById('board');
    const playersListEl = document.getElementById('players-list');
    const btnRoll = document.getElementById('btn-roll');
    const turnIndicator = document.getElementById('turn-indicator');
    const diceVisual = document.getElementById('dice-visual');
    const modalOverlay = document.getElementById('modal-overlay');

    // Initialize Game setup
    function setMode(mode) {
      gameMode = mode;
      const btnAi = document.getElementById('btn-vs-ai');
      const btnPvp = document.getElementById('btn-vs-p2');
      const groupCount = document.getElementById('player-count-group');

      if (mode === 'ai') {
        btnAi.className = "py-2 px-3 border-2 border-emerald-600 bg-emerald-50 text-emerald-800 font-bold rounded-xl text-sm transition";
        btnPvp.className = "py-2 px-3 border-2 border-slate-200 text-slate-600 font-bold rounded-xl text-sm transition";
        groupCount.classList.add('hidden');
        numPlayers = 2;
      } else {
        btnPvp.className = "py-2 px-3 border-2 border-emerald-600 bg-emerald-50 text-emerald-800 font-bold rounded-xl text-sm transition";
        btnAi.className = "py-2 px-3 border-2 border-slate-200 text-slate-600 font-bold rounded-xl text-sm transition";
        groupCount.classList.remove('hidden');
        numPlayers = parseInt(document.getElementById('select-players').value);
      }
      initGame();
    }

    function initGame() {
      if (gameMode === 'pvp') {
        numPlayers = parseInt(document.getElementById('select-players').value);
      }
      
      players = [];
      for (let i = 0; i < numPlayers; i++) {
        const config = PLAYER_CONFIGS[i];
        let name = config.name;
        if (gameMode === 'ai' && i === 1) name = "EcoBot (IA)";
        
        players.push({
          ...config,
          name: name,
          position: 1,
          points: 100,
          isAi: (gameMode === 'ai' && i === 1)
        });
      }
      
      currentPlayerIdx = 0;
      gameActive = false;
      renderBoard();
      renderScoreboard();
      btnRoll.disabled = true;
      turnIndicator.textContent = "Clique em 'Iniciar Jogo' para começar!";
    }

    function startGame() {
      gameActive = true;
      document.getElementById('setup-panel').classList.add('opacity-75');
      btnRoll.disabled = false;
      updateTurnUI();
    }

    function resetGame() {
      document.getElementById('setup-panel').classList.remove('opacity-75');
      initGame();
    }

    // Render Board Grid
    function renderBoard() {
      boardEl.innerHTML = "";
      
      for (let i = 1; i <= TOTAL_HOUSES; i++) {
        const tileData = BOARD_TILES_DATA[i] || { type: "normal", name: `Casa ${i}`, icon: "fa-leaf" };
        
        const cell = document.createElement('div');
        cell.id = `cell-${i}`;
        cell.className = `relative flex flex-col justify-between items-center p-2 rounded-xl border-2 text-center transition-all aspect-square ${getTileStyle(tileData.type)}`;

        cell.innerHTML = `
          <div class="w-full flex justify-between items-center text-xs font-bold opacity-75">
            <span>#${i}</span>
            <i class="fa-solid ${tileData.icon}"></i>
          </div>
          <div class="text-[10px] md:text-xs font-semibold line-clamp-2 my-auto">${tileData.name}</div>
          <div id="pawns-container-${i}" class="flex flex-wrap gap-1 justify-center items-center min-h-[20px] w-full"></div>
        `;
        boardEl.appendChild(cell);
      }
      renderPawns();
    }

    function getTileStyle(type) {
      switch (type) {
        case 'start': return 'bg-emerald-100 border-emerald-500 text-emerald-900 font-bold';
        case 'finish': return 'bg-amber-100 border-amber-500 text-amber-900 font-bold';
        case 'good': return 'bg-green-50 border-green-400 text-green-800';
        case 'bad': return 'bg-rose-50 border-rose-400 text-rose-800';
        case 'quiz': return 'bg-sky-50 border-sky-400 text-sky-800';
        default: return 'bg-slate-50 border-slate-200 text-slate-700';
      }
    }

    // Render Pawns inside current position tiles
    function renderPawns() {
      for (let i = 1; i <= TOTAL_HOUSES; i++) {
        const container = document.getElementById(`pawns-container-${i}`);
        if (container) container.innerHTML = "";
      }

      players.forEach(p => {
        const container = document.getElementById(`pawns-container-${p.position}`);
        if (container) {
          const pawn = document.createElement('div');
          pawn.className = `w-5 h-5 md:w-6 md:h-6 rounded-full ${p.color} text-white flex items-center justify-center text-[10px] font-bold shadow-md transform transition-all duration-300 scale-110 border-2 border-white`;
          pawn.innerHTML = `<i class="fa-solid ${p.icon}"></i>`;
          pawn.title = p.name;
          container.appendChild(pawn);
        }
      });
    }

    // Render Side Scoreboard
    function renderScoreboard() {
      playersListEl.innerHTML = "";
      players.forEach((p, idx) => {
        const isCurrent = idx === currentPlayerIdx && gameActive;
        const card = document.createElement('div');
        card.className = `p-3 rounded-xl border-2 flex items-center justify-between transition ${p.borderCol} ${isCurrent ? 'bg-emerald-50 active-player-card font-bold' : 'bg-slate-50 opacity-90'}`;

        card.innerHTML = `
          <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded-full ${p.color} text-white flex items-center justify-center font-bold text-sm">
              <i class="fa-solid ${p.icon}"></i>
            </div>
            <div>
              <div class="text-sm text-slate-800">${p.name}</div>
              <div class="text-xs text-slate-500">Casa: <span class="font-bold text-slate-700">${p.position}</span></div>
            </div>
          </div>
          <div class="text-right">
            <div class="text-xs font-semibold text-slate-400">EcoPontos</div>
            <div class="text-base font-extrabold ${p.textCol}">${p.points} pts</div>
          </div>
        `;
        playersListEl.appendChild(card);
      });
    }

    // Turn Logic
    function updateTurnUI() {
      renderScoreboard();
      const cp = players[currentPlayerIdx];
      turnIndicator.textContent = `Vez de: ${cp.name}`;
      turnIndicator.className = `text-sm font-bold ${cp.textCol}`;

      if (cp.isAi && gameActive) {
        btnRoll.disabled = true;
        setTimeout(() => {
          if (gameActive) rollDice();
        }, 1200);
      } else if (gameActive) {
        btnRoll.disabled = false;
      }
    }

    // Roll Dice Logic
    function rollDice() {
      if (isRolling || !gameActive) return;
      isRolling = true;
      btnRoll.disabled = true;

      let rollCount = 0;
      const interval = setInterval(() => {
        const tempValue = Math.floor(Math.random() * 6) + 1;
        diceVisual.innerHTML = tempValue;
        rollCount++;
        if (rollCount > 10) {
          clearInterval(interval);
          const finalValue = Math.floor(Math.random() * 6) + 1;
          diceVisual.innerHTML = finalValue;
          movePlayer(finalValue);
        }
      }, 70);
    }

    // Move Player Step-by-Step
    function movePlayer(steps) {
      const p = players[currentPlayerIdx];
      let targetPos = p.position + steps;

      if (targetPos > TOTAL_HOUSES) {
        targetPos = TOTAL_HOUSES;
      }

      let currentStep = p.position;
      const stepInterval = setInterval(() => {
        if (currentStep < targetPos) {
          currentStep++;
          p.position = currentStep;
          renderPawns();
        } else {
          clearInterval(stepInterval);
          isRolling = false;
          handleTileLanding(p.position);
        }
      }, 300);
    }

    // Handle Event on Landed Tile
    function handleTileLanding(pos) {
      const p = players[currentPlayerIdx];
      const tile = BOARD_TILES_DATA[pos];

      if (pos === TOTAL_HOUSES) {
        triggerWin(p);
        return;
      }

      if (!tile || tile.type === 'normal' || tile.type === 'start') {
        nextTurn();
        return;
      }

      if (tile.type === 'good' || tile.type === 'bad') {
        p.points = Math.max(0, p.points + tile.points);
        showModal(
          tile.name,
          tile.desc,
          tile.type === 'good' ? 'fa-circle-check text-green-500' : 'fa-triangle-exclamation text-rose-500',
          () => {
            if (tile.move) {
              p.position = Math.max(1, Math.min(TOTAL_HOUSES, p.position + tile.move));
              renderPawns();
            }
            nextTurn();
          }
        );
      } else if (tile.type === 'quiz') {
        handleQuiz(p);
      }
    }

    // Quiz Event Handler
    function handleQuiz(player) {
      const randomQuiz = QUIZ_QUESTIONS[Math.floor(Math.random() * QUIZ_QUESTIONS.length)];
      
      const modalIcon = document.getElementById('modal-icon');
      const modalTitle = document.getElementById('modal-title');
      const modalDesc = document.getElementById('modal-desc');
      const quizOptions = document.getElementById('quiz-options');
      const closeBtn = document.getElementById('modal-close-btn');

      modalIcon.className = "w-16 h-16 rounded-full mx-auto mb-3 flex items-center justify-center text-3xl bg-sky-100 text-sky-600";
      modalIcon.innerHTML = `<i class="fa-solid fa-graduation-cap"></i>`;
      modalTitle.textContent = "EcoQuiz!";
      modalDesc.textContent = randomQuiz.q;

      quizOptions.innerHTML = "";
      quizOptions.classList.remove('hidden');
      closeBtn.classList.add('hidden');

      if (player.isAi) {
        // AI selects answer automatically after short delay
        setTimeout(() => {
          const chosen = randomQuiz.options[Math.floor(Math.random() * randomQuiz.options.length)];
          processQuizResult(chosen.correct, randomQuiz.explanation);
        }, 1500);
      } else {
        randomQuiz.options.forEach(opt => {
          const btn = document.createElement('button');
          btn.className = "w-full py-2.5 px-4 bg-slate-100 hover:bg-emerald-100 border border-slate-200 text-slate-800 rounded-xl font-semibold text-sm text-left transition";
          btn.textContent = opt.text;
          btn.onclick = () => processQuizResult(opt.correct, randomQuiz.explanation);
          quizOptions.appendChild(btn);
        });
      }

      modalOverlay.classList.remove('hidden');
    }

    function processQuizResult(isCorrect, explanation) {
      const p = players[currentPlayerIdx];
      const quizOptions = document.getElementById('quiz-options');
      const closeBtn = document.getElementById('modal-close-btn');
      const modalIcon = document.getElementById('modal-icon');
      const modalTitle = document.getElementById('modal-title');
      const modalDesc = document.getElementById('modal-desc');

      quizOptions.classList.add('hidden');
      closeBtn.classList.remove('hidden');

      if (isCorrect) {
        p.points += 30;
        p.position = Math.min(TOTAL_HOUSES, p.position + 1);
        modalIcon.className = "w-16 h-16 rounded-full mx-auto mb-3 flex items-center justify-center text-3xl bg-green-100 text-green-600";
        modalIcon.innerHTML = `<i class="fa-solid fa-circle-check"></i>`;
        modalTitle.textContent = "Resposta Correta! (+30 pts)";
        modalDesc.textContent = `${explanation} Você avança +1 casa!`;
      } else {
        p.points = Math.max(0, p.points - 10);
        modalIcon.className = "w-16 h-16 rounded-full mx-auto mb-3 flex items-center justify-center text-3xl bg-rose-100 text-rose-600";
        modalIcon.innerHTML = `<i class="fa-solid fa-circle-xmark"></i>`;
        modalTitle.textContent = "Ops, Resposta Incorreta (-10 pts)";
        modalDesc.textContent = `${explanation} Fique atento na próxima!`;
      }

      renderPawns();
      renderScoreboard();

      closeBtn.onclick = () => {
        closeModal();
        nextTurn();
      };
    }

    // Modal Display Helper
    function showModal(title, desc, iconClass, onClose) {
      const modalIcon = document.getElementById('modal-icon');
      const modalTitle = document.getElementById('modal-title');
      const modalDesc = document.getElementById('modal-desc');
      const quizOptions = document.getElementById('quiz-options');
      const closeBtn = document.getElementById('modal-close-btn');

      modalIcon.className = `w-16 h-16 rounded-full mx-auto mb-3 flex items-center justify-center text-3xl bg-slate-100 ${iconClass}`;
      modalIcon.innerHTML = `<i class="fa-solid ${iconClass.split(' ')[0]}"></i>`;
      modalTitle.textContent = title;
      modalDesc.textContent = desc;

      quizOptions.classList.add('hidden');
      closeBtn.classList.remove('hidden');

      modalOverlay.classList.remove('hidden');

      closeBtn.onclick = () => {
        closeModal();
        if (onClose) onClose();
      };

      // Auto close modal for AI after delay
      if (players[currentPlayerIdx].isAi) {
        setTimeout(() => {
          closeModal();
          if (onClose) onClose();
        }, 2000);
      }
    }

    function closeModal() {
      modalOverlay.classList.add('hidden');
    }

    // Next Turn Transition
    function nextTurn() {
      if (!gameActive) return;
      currentPlayerIdx = (currentPlayerIdx + 1) % players.length;
      updateTurnUI();
    }

    // Victory Event
    function triggerWin(winner) {
      gameActive = false;
      confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 } });

      showModal(
        `🏆 ${winner.name} venceu!`,
        `Parabéns! ${winner.name} chegou ao Futuro Verde com ${winner.points} EcoPontos!`,
        'fa-trophy text-amber-500',
        () => {
          turnIndicator.textContent = `Fim de Jogo! Vitória de ${winner.name}`;
          btnRoll.disabled = true;
        }
      );
    }

    // Initialize on page load
    window.onload = () => {
      initGame();
    };
  </script>
</body>
</html>
